<div class="page-header mb-4 d-flex justify-content-between align-items-start flex-wrap gap-2">
  <div>
    <h2>Profesores</h2>
    <p class="text-muted mb-0">Gestión del cuerpo docente</p>
  </div>
  <button class="btn btn-primary" (click)="abrirFormNuevo()">
    <i class="bi bi-plus-circle me-2"></i>Nuevo Profesor
  </button>
</div>

<div class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <label class="form-label">Buscar</label>
    <input
      type="text"
      class="form-control"
      placeholder="Buscar por nombre o apellido..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="loadProfesores()"
    />
  </div>
</div>

<div class="card border-0 shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th>Nombres</th>
          <th>Apellidos</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Especialidad</th>
          <th>Estado</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let prof of profesores">
          <td>{{ prof.nombres }}</td>
          <td>{{ prof.apellidos }}</td>
          <td>{{ prof.email }}</td>
          <td>{{ prof.telefono || '-' }}</td>
          <td>{{ prof.especialidad || '-' }}</td>
          <td><span class="badge" [ngClass]="(prof.activo | statusBadge).cssClass">{{ (prof.activo | statusBadge).label }}</span></td>
          <td class="text-end">
            <button
              *ngIf="authService.canPerform('edit_profesor')"
              class="btn btn-sm btn-outline-primary me-1"
              (click)="editar(prof)"
              title="Editar"
            >
              <i class="bi bi-pencil-fill"></i>
            </button>
            <button
              *ngIf="authService.canPerform('delete_profesor')"
              class="btn btn-sm btn-outline-danger"
              (click)="eliminar(prof.id)"
              title="Eliminar"
            >
              <i class="bi bi-trash-fill"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="profesores.length === 0">
          <td colspan="7" class="text-center text-muted py-4">No hay profesores registrados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-modal
  [open]="modalOpen"
  [title]="editingId ? 'Editar Profesor' : 'Nuevo Profesor'"
  [saving]="saving"
  (closed)="closeModal()"
  (saved)="guardar()"
>
  <form [formGroup]="form">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombres <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="nombres" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Apellidos <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="apellidos" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Email <span class="text-danger">*</span></label>
        <input type="email" class="form-control" formControlName="email" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Teléfono</label>
        <input type="text" class="form-control" formControlName="telefono" />
      </div>
      <div class="col-12">
        <label class="form-label">Especialidad</label>
        <input type="text" class="form-control" formControlName="especialidad" />
      </div>
    </div>
  </form>
</app-modal>
