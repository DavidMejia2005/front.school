<div class="page-header mb-4 d-flex justify-content-between align-items-start flex-wrap gap-2">
  <div>
    <h2>Grados</h2>
    <p class="text-muted mb-0">Niveles y grados académicos</p>
  </div>
  <button class="btn btn-primary" (click)="abrirFormNuevo()">
    <i class="bi bi-plus-circle me-2"></i>Nuevo Grado
  </button>
</div>

<div class="card border-0 shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Nivel</th>
          <th>Descripción</th>
          <th>Estudiantes</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let grado of grados">
          <td>{{ grado.nombre }}</td>
          <td><span class="badge bg-secondary">{{ grado.nivel }}</span></td>
          <td>{{ grado.descripcion || '-' }}</td>
          <td>{{ grado.estudiantes ?? 0 }}</td>
          <td class="text-end">
            <button
              *ngIf="authService.canPerform('edit_grado')"
              class="btn btn-sm btn-outline-primary me-1"
              (click)="editar(grado)"
              title="Editar"
            >
              <i class="bi bi-pencil-fill"></i>
            </button>
            <button
              *ngIf="authService.canPerform('delete_grado')"
              class="btn btn-sm btn-outline-danger"
              (click)="eliminar(grado.id)"
              title="Eliminar"
            >
              <i class="bi bi-trash-fill"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="grados.length === 0">
          <td colspan="5" class="text-center text-muted py-4">No hay grados registrados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-modal
  [open]="modalOpen"
  [title]="editingId ? 'Editar Grado' : 'Nuevo Grado'"
  [saving]="saving"
  (closed)="closeModal()"
  (saved)="guardar()"
>
  <form [formGroup]="form">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombre <span class="text-danger">*</span></label>
        <input type="text" class="form-control" placeholder="Ej: Primero A" formControlName="nombre" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Nivel <span class="text-danger">*</span></label>
        <select class="form-select" formControlName="nivel">
          <option value="">Selecciona un nivel</option>
          <option value="Preescolar">Preescolar</option>
          <option value="Primaria">Primaria</option>
          <option value="Secundaria">Secundaria</option>
          <option value="Media">Media</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" rows="3" formControlName="descripcion"></textarea>
      </div>
    </div>
  </form>
</app-modal>
