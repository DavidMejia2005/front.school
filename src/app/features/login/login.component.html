<div class="login-container">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header text-center mb-4">
        <div class="logo-circle">
          <i class="bi bi-building"></i>
        </div>
        <h1 class="mt-3 text-gradient">COLEGIO</h1>
        <p class="text-muted">Sistema de Gestión Académica</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label for="login-username" class="form-label">Usuario</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
            <input
              type="text"
              id="login-username"
              class="form-control border-0 ps-2"
              placeholder="Ingresa tu usuario"
              formControlName="username"
            />
          </div>
        </div>

        <div class="mb-3">
          <label for="login-password" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
            <input
              type="password"
              id="login-password"
              class="form-control border-0 ps-2"
              placeholder="Ingresa tu contraseña"
              formControlName="password"
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" [disabled]="loading">
          <i class="bi bi-box-arrow-in-right me-2"></i>{{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      <div class="alert alert-info mb-0" role="alert">
        <i class="bi bi-info-circle me-2"></i>
        <small>
          <strong>Demo:</strong> admin / Admin2024* | secretaria / Secre2024* | docente1 / Docente2024*
        </small>
      </div>
    </div>
  </div>
</div>
