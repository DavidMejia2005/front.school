<div class="page-header mb-4 d-flex justify-content-between align-items-start flex-wrap gap-2">
  <div>
    <h2>Estudiantes</h2>
    <p class="text-muted mb-0">Gestión de estudiantes matriculados</p>
  </div>
  <button class="btn btn-primary" (click)="abrirFormNuevo()">
    <i class="bi bi-plus-circle me-2"></i>Nuevo Estudiante
  </button>
</div>

<div class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Buscar</label>
        <input
          type="text"
          class="form-control"
          placeholder="Buscar por nombre o apellido..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="loadEstudiantes()"
        />
      </div>
      <div class="col-md-4">
        <label class="form-label">Grado</label>
        <select class="form-select" [(ngModel)]="filterGradoId" (ngModelChange)="loadEstudiantes()">
          <option value="">Todos los grados</option>
          <option *ngFor="let g of grados" [value]="g.id">{{ g.nombre }}</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="card border-0 shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th>Nombres</th>
          <th>Apellidos</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Grado</th>
          <th>Estado</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let est of estudiantes">
          <td>{{ est.nombres }}</td>
          <td>{{ est.apellidos }}</td>
          <td>{{ est.email }}</td>
          <td>{{ est.telefono || '-' }}</td>
          <td>{{ nombreGrado(est.grado_id) }}</td>
          <td><span class="badge" [ngClass]="(est.activo | statusBadge).cssClass">{{ (est.activo | statusBadge).label }}</span></td>
          <td class="text-end">
            <button
              *ngIf="authService.canPerform('edit_estudiante')"
              class="btn btn-sm btn-outline-primary me-1"
              (click)="editar(est)"
              title="Editar"
            >
              <i class="bi bi-pencil-fill"></i>
            </button>
            <button
              *ngIf="authService.canPerform('delete_estudiante')"
              class="btn btn-sm btn-outline-danger"
              (click)="eliminar(est.id)"
              title="Eliminar"
            >
              <i class="bi bi-trash-fill"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="estudiantes.length === 0">
          <td colspan="7" class="text-center text-muted py-4">No hay estudiantes registrados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-modal
  [open]="modalOpen"
  [title]="editingId ? 'Editar Estudiante' : 'Nuevo Estudiante'"
  [saving]="saving"
  (closed)="closeModal()"
  (saved)="guardar()"
>
  <form [formGroup]="form">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombres <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="nombres" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Apellidos <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="apellidos" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Email <span class="text-danger">*</span></label>
        <input type="email" class="form-control" formControlName="email" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Teléfono</label>
        <input type="text" class="form-control" formControlName="telefono" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Fecha de Nacimiento</label>
        <input type="date" class="form-control" formControlName="fecha_nac" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Grado <span class="text-danger">*</span></label>
        <select class="form-select" formControlName="grado_id">
          <option value="">Selecciona un grado</option>
          <option *ngFor="let g of grados" [value]="g.id">{{ g.nombre }}</option>
        </select>
      </div>
    </div>
  </form>
</app-modal>
